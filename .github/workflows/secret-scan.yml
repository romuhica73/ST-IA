name: Secret scan

# Volontairement séparé de security.yml. Les audits de dépendances n'ont de sens
# que lorsque les dépendances changent, et security.yml filtre donc ses
# déclencheurs sur les fichiers de lock. Un secret, lui, arrive dans n'importe
# quel fichier — un test, une doc, un commentaire. Sous ce filtre, une PR de code
# n'était pas scannée du tout et un secret pouvait attendre le lundi suivant.
#
# Ce workflow n'a donc aucun filtre `paths`.
#
# Il complète, sans le remplacer, le Push Protection natif de GitHub : Push
# Protection bloque *avant* que le secret n'entre dans l'historique, ce que ce
# scan ne sait faire que constater. Voir docs/release/GITHUB_PUBLICATION_CHECKLIST.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks a besoin de l'historique complet : un secret introduit puis
          # supprimé reste dans les objets Git et n'apparaît pas dans un
          # checkout superficiel.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
