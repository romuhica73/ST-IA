name: Security audit

# Séparé de ci.yml délibérément. Ces vérifications dépendent de bases de données
# externes (RustSec, npm advisories) qui changent sans rapport avec le contenu
# d'une PR : un nouvel advisory publié un mardi ferait échouer une PR de
# documentation. Ici, un échec est un signal à traiter, pas un gate qui bloque.
on:
  schedule:
    # Lundi 06:00 UTC, avant les PR Dependabot de la même journée.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    # Sur PR, uniquement quand les dépendances elles-mêmes changent.
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--prod` : les vulnérabilités devDependencies n'atteignent pas
      # l'utilisateur (rien de tout cela n'est embarqué dans le .app). Elles
      # sont couvertes par le job non bloquant ci-dessous.
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level moderate
      - name: Audit all dependencies (informational)
        run: pnpm audit || true

  cargo-audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

# Le scan de secrets vivait ici et héritait du filtre `paths` ci-dessus, donc ne
# tournait pas sur une PR de code. Il a sa propre workflow, sans filtre :
# .github/workflows/secret-scan.yml
