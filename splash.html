<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No localizable text: the splash shows the ST-IA mark only, so it
         cannot flash the wrong language before settings have loaded. -->
    <!-- Distinct from the window title Rust sets, so the render check can
         tell "the document loaded" apart from "the window merely exists". -->
    <title>ST-IA:splash</title>
  </head>

  <body>
    <!-- Purely decorative: the whole composition is one graphic with no
         information a screen reader could use, and the window is closed
         within a second. -->
    <div class="splash" aria-hidden="true">
      <div class="splash__mark">
        <div class="wave">
          <span class="wave__bar"></span>
          <span class="wave__bar"></span>
          <span class="wave__bar"></span>
          <span class="wave__bar"></span>
          <span class="wave__bar"></span>
          <span class="wave__bar"></span>
          <span class="wave__bar"></span>
          <span class="wave__bar"></span>
          <span class="wave__bar"></span>
        </div>
        <div class="lines">
          <span class="lines__line"></span>
          <span class="lines__line"></span>
        </div>
      </div>
      <p class="splash__wordmark">ST-IA</p>
    </div>
    <script type="module" src="/src/splash/main.ts"></script>
  </body>
</html>
